server {
    listen 80;
    root /usr/share/nginx/html;

    # Client-side routes (/leases, /lease/12, ...) all load the single page.
    location / {
        try_files $uri /index.html;
    }

    # Hashed bundles can be cached for good; the HTML and service worker must not be.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /mockServiceWorker.js {
        add_header Cache-Control "no-cache";
    }
}
